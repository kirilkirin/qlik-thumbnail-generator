<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlik thumbnail generator v4</title>
<!--
  Qlik thumbnail generator — a single-file tool for making 8:5 thumbnails
  for Qlik Sense apps, sheets and stories (Qlik Cloud and Client-Managed).

  Version 4 — icon picker grouped by Lucide's own categories (loaded live from
  lucide.dev and Lucide's repository), tag search, library tracks the latest 1.x release.

  Icons, tags and categories: Lucide (https://lucide.dev), loaded at runtime.
  Lucide is released under the ISC License:
    Copyright (c) for portions of Lucide are held by Cole Bemis 2013-2022 as part of Feather (MIT).
    All other copyright (c) for Lucide are held by Lucide Contributors 2022.
    Permission to use, copy, modify, and/or distribute this software for any purpose with or
    without fee is hereby granted, provided that the above copyright notice and this permission
    notice appear in all copies.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F4F6;
    --panel: #FFFFFF;
    --line: #DDE1E6;
    --line-strong: #B9BEC7;
    --text: #454659;
    --muted: #6E7180;
    --green: #009845;
    --green-dark: #00783A;
    --green-tint: #E0F2E9;
    --focus: #10CFC9;
    --radius: 6px;
    --font: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header {
    padding: 14px 28px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); }

  .app {
    display: grid;
    grid-template-columns: 440px minmax(0, 1fr);
    flex: 1;
    min-height: 0;            /* lets the grid children shrink and scroll */
  }
  .controls {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 2px 24px 12px;
    overflow-y: auto;
    min-height: 0;
  }
  .stage {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    overflow-y: auto;
    min-height: 0;
  }

  fieldset {
    border: 0;
    margin: 0;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  fieldset:last-of-type { border-bottom: 0; }
  legend { font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 8px; }

  .field { display: block; margin-bottom: 8px; }
  .field:last-child { margin-bottom: 0; }
  .field > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 13px; }
  input[type="text"], input[type="search"], select {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: #fff;
  }
  input[type="text"]:focus, input[type="search"]:focus, select:focus {
    border-color: var(--green);
    outline: none;
    box-shadow: 0 0 0 3px var(--green-tint);
  }
  input[type="range"] { width: 100%; accent-color: var(--green); margin: 6px 0 0; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* Layout picker */
  .layouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .layouts button {
    height: 52px;
    padding: 0;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--muted);
  }
  .layouts button svg { width: 44px; height: 27px; display: block; }
  .layouts button[aria-pressed="true"] {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-tint);
  }

  /* Colors */
  .colors { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
  .color-field { display: block; }
  .color-field > span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 13px; }
  .color-box {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 8px 0 4px;
    border: 1px solid var(--line-strong); border-radius: var(--radius); background: #fff;
  }
  .color-box input[type="color"] {
    width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer;
  }
  .color-box input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .color-box input[type="color"]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
  .color-box input[type="color"]::-moz-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
  .color-box output { font-variant-numeric: tabular-nums; font-size: 13px; }
  .swap {
    height: 36px; width: 36px; padding: 0;
    border: 1px solid var(--line-strong); border-radius: var(--radius); background: #fff;
    cursor: pointer; display: grid; place-items: center; color: var(--muted);
  }
  .swap:hover { color: var(--text); border-color: var(--text); }
  .swatches { display: flex; gap: 8px; margin-top: 12px; }
  .swatches button {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.12); cursor: pointer;
    position: relative;
  }
  .swatches button::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: var(--fg);
  }

  /* Current icon control (panel) */
  .icon-current {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 8px 8px 8px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: #fff;
  }
  .icon-current-preview {
    width: 48px; height: 48px; flex: none;
    display: grid; place-items: center;
    border-radius: 4px;
    background: var(--green-tint);
    color: var(--green);
  }
  .icon-current-preview svg { width: 28px; height: 28px; }
  .icon-current-info { flex: 1; min-width: 0; }
  .icon-current-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-current-hint { color: var(--muted); font-size: 12px; }
  .btn-secondary {
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    background: #fff;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-secondary:hover:not(:disabled) { border-color: var(--text); }
  .btn-secondary:disabled { color: var(--muted); cursor: default; }

  /* Icon picker dialog */
  dialog#picker {
    width: min(1120px, 96vw);
    height: min(780px, 92vh);
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 20px 60px rgba(69, 70, 89, 0.25);
  }
  dialog#picker::backdrop { background: rgba(69, 70, 89, 0.45); }
  dialog#picker[open] { display: flex; flex-direction: column; }
  .picker-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    flex: none;
  }
  .picker-head input[type="search"] { flex: 1; max-width: 420px; }
  .picker-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .picker-close {
    margin-left: auto;
    width: 34px; height: 34px; padding: 0;
    border: 1px solid transparent; border-radius: var(--radius);
    background: transparent; cursor: pointer; color: var(--muted);
    display: grid; place-items: center;
  }
  .picker-close:hover { color: var(--text); border-color: var(--line-strong); }
  .picker-body { flex: 1; min-height: 0; display: flex; }
  .picker-rail {
    width: 210px;
    flex: none;
    overflow-y: auto;
    border-right: 1px solid var(--line);
    padding: 8px;
  }
  .picker-rail[hidden] { display: none; }
  .picker-rail button {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    color: var(--text);
  }
  .picker-rail button span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .picker-rail button:hover { background: var(--bg); }
  .picker-rail button[aria-current="true"] { background: var(--green-tint); color: var(--green); font-weight: 500; }
  .picker-rail button[aria-current="true"] span { color: var(--green); }
  .picker-scroll {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    padding: 4px 16px 24px;
    background: #FAFBFC;
    position: relative;
  }
  .cat { padding-top: 14px; }
  .cat h3 {
    margin: 0 0 8px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cat h3 svg { width: 18px; height: 18px; color: var(--muted); }
  .cat h3 span { color: var(--muted); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; }
  .cat-grid, .flat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    grid-auto-rows: 56px;
    gap: 6px;
    align-content: start;
  }
  .flat-grid { padding-top: 12px; }
  .picker-scroll button.ic {
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--text);
  }
  .picker-scroll button.ic svg { width: 26px; height: 26px; }
  .picker-scroll button.ic:hover { background: #fff; border-color: var(--line-strong); }
  .picker-scroll button.ic[aria-pressed="true"] { background: var(--green-tint); border-color: var(--green); color: var(--green); }
  .picker-scroll .notice { padding: 24px 12px; color: var(--muted); }
  .picker-foot {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 700px) {
    .picker-rail { width: 150px; }
  }

  /* Preview */
  .preview {
    width: 100%;
    max-width: min(880px, calc((100vh - 290px) * 1.6));
    border: 1px solid var(--line);
    background: #fff;
    padding: 12px;
  }
  .preview canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 8 / 5;
  }
  .output-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .output-bar .field { margin: 0; }
  .output-bar select { width: 150px; }
  .download {
    height: 36px;
    padding: 0 20px;
    border: 0;
    border-radius: var(--radius);
    background: var(--green);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  .download:hover { background: var(--green-dark); }

  footer {
    padding: 10px 28px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    background: var(--panel);
    flex: none;
  }
  footer a { color: inherit; }

  @media (max-width: 900px) {
    .preview { max-width: 100%; }
    body { height: auto; display: block; }
    .app { grid-template-columns: 1fr; }
    .controls { border-right: 0; border-top: 1px solid var(--line); overflow: visible; order: 2; }
    .stage { padding: 20px 16px; overflow: visible; order: 1; }
    header { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Qlik thumbnail generator</h1>
  <p>Makes 8:5 thumbnails for apps, sheets and stories — the aspect ratio Qlik Sense expects in the media library.</p>
</header>

<main class="app">
  <section class="controls" aria-label="Thumbnail settings">

    <fieldset>
      <legend>Text</legend>
      <label class="field"><span>Title</span>
        <input type="text" id="title" value="Sales Dashboard" maxlength="80" autocomplete="off">
      </label>
      <label class="field"><span>Second line (optional)</span>
        <input type="text" id="subtitle" value="" maxlength="80" placeholder="e.g. Finance, Weekly" autocomplete="off">
      </label>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="layouts" role="group" aria-label="Layout">
        <button type="button" data-layout="left" aria-pressed="true" title="Icon left, text right">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><rect x="7" y="8" width="11" height="11" rx="1.5"/><path d="M23 11h13M23 16h9"/></svg>
        </button>
        <button type="button" data-layout="top" aria-pressed="false" title="Icon above text">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><rect x="17.5" y="5" width="9" height="9" rx="1.5"/><path d="M14 19h16"/></svg>
        </button>
        <button type="button" data-layout="icon" aria-pressed="false" title="Icon only">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><rect x="16" y="7.5" width="12" height="12" rx="1.5"/></svg>
        </button>
        <button type="button" data-layout="text" aria-pressed="false" title="Text only">
          <svg viewBox="0 0 44 27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="42" height="25" rx="2"/><path d="M12 11h20M16 16h12"/></svg>
        </button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Colors</legend>
      <div class="colors">
        <label class="color-field"><span>Background</span>
          <div class="color-box"><input type="color" id="bg" value="#009845"><output id="bgHex">#009845</output></div>
        </label>
        <label class="color-field"><span>Icon and text</span>
          <div class="color-box"><input type="color" id="fg" value="#FFFFFF"><output id="fgHex">#FFFFFF</output></div>
        </label>
        <button type="button" class="swap" id="swap" title="Swap colors" aria-label="Swap colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
        </button>
      </div>
      <div class="swatches" id="swatches" aria-label="Color presets"></div>
    </fieldset>

    <fieldset id="iconSection">
      <legend>Icon</legend>
      <div class="icon-current">
        <div class="icon-current-preview" id="iconPreview" aria-hidden="true"></div>
        <div class="icon-current-info">
          <div class="icon-current-name" id="iconName">Loading icon library…</div>
          <div class="icon-current-hint" id="iconHint"></div>
        </div>
        <button type="button" class="btn-secondary" id="changeIcon" disabled>Change icon</button>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="field"><span>Icon size</span>
          <input type="range" id="iconSize" min="20" max="70" value="42">
        </label>
        <label class="field"><span>Line weight</span>
          <input type="range" id="stroke" min="1" max="3" step="0.25" value="2">
        </label>
      </div>
    </fieldset>

  </section>

  <section class="stage" aria-label="Preview">
    <div class="preview"><canvas id="canvas" width="1280" height="800" aria-label="Thumbnail preview"></canvas></div>
    <div class="output-bar">
      <label class="field"><span>Size (pixels)</span>
        <select id="size">
          <option value="640">640 × 400</option>
          <option value="800">800 × 500</option>
          <option value="1280" selected>1280 × 800</option>
          <option value="1600">1600 × 1000</option>
          <option value="2560">2560 × 1600</option>
        </select>
      </label>
      <label class="field"><span>Format</span>
        <select id="format">
          <option value="png" selected>PNG</option>
          <option value="jpg">JPG</option>
        </select>
      </label>
      <button type="button" class="download" id="download">Download PNG</button>
    </div>
  </section>
</main>

<dialog id="picker" aria-label="Choose an icon">
  <div class="picker-head">
    <input type="search" id="iconSearch" placeholder="Search icons" autocomplete="off" aria-label="Search icons">
    <span class="picker-count" id="iconStatus"></span>
    <button type="button" class="picker-close" id="pickerClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="picker-body">
    <nav class="picker-rail" id="rail" aria-label="Categories"></nav>
    <div class="picker-scroll" id="gridWrap" role="listbox" aria-label="Icons"></div>
  </div>
  <div class="picker-foot">
    <span id="iconSource"></span>
    <span id="iconHover"></span>
  </div>
</dialog>

<footer>
  Icons, tags and categories by <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a> (ISC license). Text uses Inter. Nothing you type leaves this page.
</footer>

<script>
(function () {
  // ---- Lucide loader with fallback CDN -------------------------------------------------
  var LUCIDE_URLS = [
    'https://cdn.jsdelivr.net/npm/lucide@1/dist/umd/lucide.min.js',
    'https://unpkg.com/lucide@1/dist/umd/lucide.min.js'
  ];
  function loadLucide(i) {
    if (i >= LUCIDE_URLS.length) { window.__lucideFailed = true; if (window.__onLucide) window.__onLucide(); return; }
    var s = document.createElement('script');
    s.src = LUCIDE_URLS[i];
    s.onload = function () { if (window.__onLucide) window.__onLucide(); };
    s.onerror = function () { loadLucide(i + 1); };
    document.head.appendChild(s);
  }
  loadLucide(0);
})();
</script>

<script>
(function () {
  'use strict';

  var FONT = 'Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  var CHUNK = 300;                       // icons rendered per scroll chunk in search results
  // Search tags: lucide.dev first, then the lucide-static package (same data, per release).
  var TAG_URLS = [
    'https://lucide.dev/api/tags',
    'https://cdn.jsdelivr.net/npm/lucide-static@1/tags.json',
    'https://unpkg.com/lucide-static@1/tags.json'
  ];
  // Category membership: { "icon-name": ["slug", ...] }
  var CAT_URL = 'https://lucide.dev/api/categories';
  // Category definitions (title, icon) from Lucide's repository, via CDN mirror then GitHub raw.
  function catDefUrls(slug) {
    return [
      'https://cdn.jsdelivr.net/gh/lucide-icons/lucide@main/categories/' + slug + '.json',
      'https://raw.githubusercontent.com/lucide-icons/lucide/main/categories/' + slug + '.json'
    ];
  }

  var state = {
    title: 'Sales Dashboard',
    subtitle: '',
    layout: 'left',          // left | top | icon | text
    icon: 'ChartColumn',
    iconSize: 0.42,          // fraction of canvas height
    stroke: 2,
    bg: '#009845',
    fg: '#FFFFFF',
    width: 1280,
    format: 'png'
  };

  var ICONS = null;          // { PascalName: [[tag, attrs], ...] }
  var iconList = [];         // [{ name, label }]

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('canvas');
  var ctx = canvas.getContext('2d');

  // ---- Presets ----------------------------------------------------------------------
  var PRESETS = [
    ['#009845', '#FFFFFF'],
    ['#454659', '#FFFFFF'],
    ['#19416C', '#FFFFFF'],
    ['#006580', '#FFFFFF'],
    ['#93579C', '#FFFFFF'],
    ['#FFFFFF', '#009845']
  ];
  var swatches = $('swatches');
  PRESETS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.style.background = p[0];
    b.style.setProperty('--fg', p[1]);
    b.title = p[0] + ' on ' + p[1];
    b.setAttribute('aria-label', 'Background ' + p[0] + ', foreground ' + p[1]);
    b.addEventListener('click', function () { setColors(p[0], p[1]); });
    swatches.appendChild(b);
  });

  function setColors(bg, fg) {
    state.bg = bg.toUpperCase(); state.fg = fg.toUpperCase();
    $('bg').value = state.bg; $('fg').value = state.fg;
    $('bgHex').textContent = state.bg; $('fgHex').textContent = state.fg;
    render();
  }

  // ---- Text helpers -----------------------------------------------------------------
  function fontStr(weight, size) { return weight + ' ' + size + 'px ' + FONT; }

  function wrap(text, font, maxW) {
    ctx.font = font;
    var words = text.trim().split(/\s+/).filter(Boolean);
    var lines = [], cur = '';
    words.forEach(function (w) {
      var test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width <= maxW || !cur) cur = test;
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function widest(lines, font) {
    ctx.font = font;
    return lines.reduce(function (m, l) { return Math.max(m, ctx.measureText(l).width); }, 0);
  }

  // Shrinks the title size until title + subtitle fit the box.
  function fitText(title, subtitle, maxW, maxH, startSize, maxTitleLines) {
    var size = startSize, best = null;
    for (var i = 0; i < 40; i++) {
      var tFont = fontStr(600, size), sSize = Math.round(size * 0.5), sFont = fontStr(400, sSize);
      var tl = title ? wrap(title, tFont, maxW) : [];
      var sl = subtitle ? wrap(subtitle, sFont, maxW) : [];
      var tH = tl.length * size * 1.15;
      var sH = sl.length ? size * 0.3 + sl.length * sSize * 1.3 : 0;
      var h = tH + sH;
      var w = Math.max(widest(tl, tFont), widest(sl, sFont));
      best = { size: size, sSize: sSize, tl: tl, sl: sl, h: h, tH: tH };
      if (tl.length <= maxTitleLines && sl.length <= 2 && h <= maxH && w <= maxW) return best;
      size = Math.max(8, Math.round(size * 0.92));
    }
    return best;
  }

  function drawTextBlock(block, x, y, align) {
    // y is the top of the block; x is left edge (align left) or centre (align center)
    ctx.fillStyle = state.fg;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    var cy = y;
    ctx.font = fontStr(600, block.size);
    block.tl.forEach(function (line) {
      cy += block.size * 1.15;
      ctx.fillText(line, x, cy - block.size * 0.22);
    });
    if (block.sl.length) {
      cy += block.size * 0.3;
      ctx.font = fontStr(400, block.sSize);
      ctx.globalAlpha = 0.8;
      block.sl.forEach(function (line) {
        cy += block.sSize * 1.3;
        ctx.fillText(line, x, cy - block.sSize * 0.3);
      });
      ctx.globalAlpha = 1;
    }
  }

  // ---- Icon helpers -----------------------------------------------------------------
  function toPath(tag, a) {
    var p = new Path2D();
    switch (tag) {
      case 'path': p.addPath(new Path2D(a.d)); break;
      case 'circle': p.arc(+a.cx, +a.cy, +a.r, 0, Math.PI * 2); break;
      case 'ellipse': p.ellipse(+a.cx, +a.cy, +a.rx, +a.ry, 0, 0, Math.PI * 2); break;
      case 'rect': {
        var rx = +(a.rx || a.ry || 0);
        if (rx && typeof p.roundRect === 'function') p.roundRect(+a.x, +a.y, +a.width, +a.height, rx);
        else p.rect(+a.x, +a.y, +a.width, +a.height);
        break;
      }
      case 'line': p.moveTo(+a.x1, +a.y1); p.lineTo(+a.x2, +a.y2); break;
      case 'polyline':
      case 'polygon': {
        var pts = String(a.points).trim().split(/[\s,]+/).map(Number);
        p.moveTo(pts[0], pts[1]);
        for (var i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]);
        if (tag === 'polygon') p.closePath();
        break;
      }
      default: return null;
    }
    return p;
  }

  function drawIcon(node, x, y, px) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(px / 24, px / 24);
    ctx.lineWidth = state.stroke;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = state.fg;
    ctx.fillStyle = state.fg;
    node.forEach(function (n) {
      var p = toPath(n[0], n[1] || {});
      if (!p) return;
      if (n[1] && n[1].fill && n[1].fill !== 'none') ctx.fill(p);
      ctx.stroke(p);
    });
    ctx.restore();
  }

  function iconSvg(node) {
    var body = node.map(function (n) {
      var attrs = Object.keys(n[1] || {}).map(function (k) { return ' ' + k + '="' + n[1][k] + '"'; }).join('');
      return '<' + n[0] + attrs + '/>';
    }).join('');
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }

  function kebab(name) {
    return name
      .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
      .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
      .replace(/([a-zA-Z])(\d)/g, '$1-$2')
      .toLowerCase();
  }

  // ---- Render -----------------------------------------------------------------------
  function render() {
    var W = state.width, H = Math.round(W * 5 / 8);
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }

    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, W, H);

    var pad = W * 0.08;
    var node = ICONS && ICONS[state.icon];
    var hasIcon = state.layout !== 'text' && !!node;
    var title = state.title.trim(), subtitle = state.subtitle.trim();
    var hasText = state.layout !== 'icon' && (title || subtitle);

    if (!hasIcon && !hasText) return;

    if (hasIcon && !hasText) {
      var s = state.iconSize * H * (state.layout === 'icon' ? 1.15 : 1);
      s = Math.min(s, H - 2 * pad * 0.5);
      drawIcon(node, (W - s) / 2, (H - s) / 2, s);
      return;
    }

    if (!hasIcon) {
      var blockT = fitText(title, subtitle, W - 2 * pad, H - 2 * pad * 0.7, H * 0.14, 3);
      drawTextBlock(blockT, W / 2, (H - blockT.h) / 2, 'center');
      return;
    }

    if (state.layout === 'left') {
      var ip = state.iconSize * H;
      var gap = W * 0.05;
      var textX = pad + ip + gap;
      var block = fitText(title, subtitle, W - pad - textX, H - 2 * pad * 0.7, H * 0.135, 3);
      drawIcon(node, pad, (H - ip) / 2, ip);
      drawTextBlock(block, textX, (H - block.h) / 2, 'left');
      return;
    }

    if (state.layout === 'top') {
      var ip2 = state.iconSize * H * 0.85;
      var gap2 = H * 0.06;
      var avail = H - 2 * pad * 0.6 - ip2 - gap2;
      var block2 = fitText(title, subtitle, W - 2 * pad, avail, H * 0.115, 2);
      var total = ip2 + gap2 + block2.h;
      var top = (H - total) / 2;
      drawIcon(node, (W - ip2) / 2, top, ip2);
      drawTextBlock(block2, W / 2, top + ip2 + gap2, 'center');
    }
  }

  // ---- Icon picker ------------------------------------------------------------------
  var picker = $('picker'), rail = $('rail'), scroller = $('gridWrap');
  var status = $('iconStatus'), source = $('iconSource'), hover = $('iconHover');
  var search = $('iconSearch'), changeBtn = $('changeIcon');

  var TAGS = {};                 // normalised name -> "tag tag tag"
  var byKey = {};                // normalised name -> icon entry {name, label, key}
  var browseList = [];           // entries shown in the picker (categorised icons when available)
  var CATS = null;               // [{slug, title, icon, items:[entry]}] sorted by slug; null = unavailable
  var visible = [], renderedCount = 0;   // search results (flat, chunked)
  var observer = null;

  function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function iconButton(it) {
    return '<button type="button" class="ic" role="option" data-name="' + it.name + '" title="' + esc(it.label) +
      '" aria-label="' + esc(it.label) + '" aria-pressed="' + (it.name === state.icon) + '">' + iconSvg(ICONS[it.name]) + '</button>';
  }

  // Exact tile-grid height for n icons at the current width, so unfilled sections keep
  // the scroll position stable and rail jumps land on the right heading.
  function gridHeight(n) {
    var cols = Math.max(1, Math.floor((scroller.clientWidth - 32 + 6) / 62));
    var rows = Math.ceil(n / cols);
    return rows * 56 + Math.max(0, rows - 1) * 6;
  }

  // ---- Grouped view (categories) ----
  function renderGroups() {
    if (observer) { observer.disconnect(); observer = null; }
    scroller.innerHTML = '';
    if (!CATS) { renderFlat(browseList, 'A to Z'); return; }
    rail.hidden = false;
    rail.innerHTML = CATS.map(function (c) {
      return '<button type="button" data-slug="' + c.slug + '" aria-current="false">' + esc(c.title) + '<span>' + c.items.length + '</span></button>';
    }).join('');
    scroller.innerHTML = CATS.map(function (c) {
      var head = (c.icon && ICONS[c.icon]) ? iconSvg(ICONS[c.icon]) : '';
      return '<section class="cat" data-slug="' + c.slug + '"><h3>' + head + esc(c.title) + '<span>' + c.items.length + '</span></h3>' +
        '<div class="cat-grid" style="height:' + gridHeight(c.items.length) + 'px"></div></section>';
    }).join('');
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) fillSection(e.target); });
    }, { root: scroller, rootMargin: '600px 0px' });
    scroller.querySelectorAll('.cat').forEach(function (sec) { observer.observe(sec); });
    status.textContent = browseList.length.toLocaleString() + ' icons in ' + CATS.length + ' categories';
    updateRail();
  }

  function fillSection(sec) {
    var grid = sec.querySelector('.cat-grid');
    if (grid.dataset.filled) return;
    var cat = CATS.filter(function (c) { return c.slug === sec.dataset.slug; })[0];
    grid.innerHTML = cat.items.map(iconButton).join('');
    grid.dataset.filled = '1';
    if (observer) observer.unobserve(sec);
  }

  function relayout() {
    if (!picker.open || !CATS || search.value.trim()) return;
    scroller.querySelectorAll('.cat').forEach(function (sec) {
      var cat = CATS.filter(function (c) { return c.slug === sec.dataset.slug; })[0];
      sec.querySelector('.cat-grid').style.height = gridHeight(cat.items.length) + 'px';
    });
  }
  window.addEventListener('resize', relayout);

  var pinUntil = 0;   // after a rail jump, keep that category highlighted even if it can't reach the top
  function jumpTo(slug) {
    var sec = scroller.querySelector('.cat[data-slug="' + slug + '"]');
    if (!sec) return;
    fillSection(sec);
    pinUntil = Date.now() + 500;
    scroller.scrollTo({ top: sec.offsetTop - 4, behavior: 'auto' });
    updateRail(slug);
  }

  function updateRail(forceSlug) {
    if (!CATS || rail.hidden) return;
    var slug = forceSlug;
    if (!slug) {
      var y = scroller.scrollTop + 60, current = CATS[0].slug;
      scroller.querySelectorAll('.cat').forEach(function (sec) { if (sec.offsetTop <= y) current = sec.dataset.slug; });
      slug = current;
    }
    rail.querySelectorAll('button').forEach(function (b) {
      var on = b.dataset.slug === slug;
      b.setAttribute('aria-current', String(on));
      if (on && forceSlug === undefined) b.scrollIntoView({ block: 'nearest' });
    });
  }

  rail.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-slug]');
    if (b) jumpTo(b.dataset.slug);
  });

  // ---- Flat view (search results, or everything when categories are unavailable) ----
  function renderFlat(list, caption) {
    rail.hidden = true;
    visible = list;
    renderedCount = 0;
    scroller.innerHTML = '<div class="flat-grid" id="flatGrid"></div>';
    scroller.scrollTop = 0;
    appendChunk();
    if (!list.length) {
      scroller.innerHTML = '<div class="notice">No icons match "' + esc(search.value.trim()) + '".</div>';
      status.textContent = '0 icons';
    } else {
      status.textContent = list.length.toLocaleString() + ' icons' + (caption ? ', ' + caption : '');
    }
  }

  function appendChunk() {
    var grid = $('flatGrid');
    if (!grid || renderedCount >= visible.length) return;
    var next = visible.slice(renderedCount, renderedCount + CHUNK);
    grid.insertAdjacentHTML('beforeend', next.map(iconButton).join(''));
    renderedCount += next.length;
  }

  function matches(q) {
    var tokens = q.toLowerCase().split(/[\s,]+/).filter(Boolean).map(function (t) { return t.replace(/-/g, ''); });
    return browseList.filter(function (it) {
      var hay = (it.key + ' ' + it.label + ' ' + (TAGS[it.key] || '')).replace(/[\s-]/g, '');
      return tokens.every(function (t) { return hay.indexOf(t) !== -1; });
    });
  }

  function renderPicker() {
    if (!ICONS) return;
    var q = search.value.trim();
    if (q) renderFlat(matches(q), 'match');
    else renderGroups();
  }

  var ticking = false;
  scroller.addEventListener('scroll', function () {
    if (search.value.trim()) {
      if (scroller.scrollTop + scroller.clientHeight > scroller.scrollHeight - 800) appendChunk();
      return;
    }
    if (Date.now() < pinUntil) return;
    if (!ticking) { ticking = true; requestAnimationFrame(function () { updateRail(); ticking = false; }); }
  });

  scroller.addEventListener('mouseover', function (e) {
    var b = e.target.closest('button.ic');
    hover.textContent = b ? b.getAttribute('title') : '';
  });
  scroller.addEventListener('mouseleave', function () { hover.textContent = ''; });

  function selectIcon(name) {
    state.icon = name;
    updateCurrentIcon();
    render();
  }

  scroller.addEventListener('click', function (e) {
    var b = e.target.closest('button.ic');
    if (!b) return;
    selectIcon(b.getAttribute('data-name'));
    picker.close();
  });

  search.addEventListener('input', renderPicker);
  search.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && search.value.trim() && visible.length) { e.preventDefault(); selectIcon(visible[0].name); picker.close(); }
  });

  function openPicker() {
    if (!ICONS) return;
    search.value = '';
    picker.showModal();
    renderPicker();
    // Open at the first category that contains the current icon.
    if (CATS) {
      var cur = byKey[norm(state.icon)];
      var home = cur && CATS.filter(function (c) { return c.items.indexOf(cur) !== -1; })[0];
      if (home) jumpTo(home.slug);
    }
    search.focus();
  }
  changeBtn.addEventListener('click', openPicker);
  $('pickerClose').addEventListener('click', function () { picker.close(); });
  picker.addEventListener('click', function (e) { if (e.target === picker) picker.close(); });
  picker.addEventListener('close', function () { changeBtn.focus(); });

  function updateCurrentIcon() {
    var node = ICONS && ICONS[state.icon];
    var entry = byKey[norm(state.icon)];
    $('iconPreview').innerHTML = node ? iconSvg(node) : '';
    $('iconName').textContent = node ? (entry ? entry.label : kebab(state.icon)) : '';
  }

  // ---- Metadata loaders (all from Lucide) ----
  function fetchJson(urls, i) {
    i = i || 0;
    if (i >= urls.length) return Promise.reject(new Error('unavailable'));
    return fetch(urls[i]).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .catch(function () { return fetchJson(urls, i + 1); });
  }

  function loadTags() {
    fetchJson(TAG_URLS).then(function (json) {
      if (!json || typeof json !== 'object' || Array.isArray(json)) throw new Error('shape');
      Object.keys(json).forEach(function (k) {
        var v = json[k];
        TAGS[norm(k)] = (Array.isArray(v) ? v : [v]).join(' ').toLowerCase();
      });
      $('iconHint').textContent = 'Search by name or meaning';
    }).catch(function () { $('iconHint').textContent = 'Search by name'; });
  }

  function prettify(slug) { return slug.replace(/-/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); }); }

  function loadCategories() {
    source.textContent = 'Loading categories…';
    fetchJson([CAT_URL]).then(function (json) {
      if (!json || typeof json !== 'object' || Array.isArray(json)) throw new Error('shape');
      var groups = {};
      var seen = [];
      Object.keys(json).forEach(function (kebabName) {
        var entry = byKey[norm(kebabName)];
        if (!entry) return;                              // not in the loaded library version
        entry.label = kebabName;                         // use Lucide's own name
        seen.push(entry);
        (Array.isArray(json[kebabName]) ? json[kebabName] : []).forEach(function (slug) {
          (groups[slug] = groups[slug] || []).push(entry);
        });
      });
      if (!seen.length) throw new Error('empty');
      browseList = seen.sort(function (a, b) { return a.label < b.label ? -1 : 1; });
      CATS = Object.keys(groups).sort().map(function (slug) {
        return { slug: slug, title: prettify(slug), icon: null,
                 items: groups[slug].sort(function (a, b) { return a.label < b.label ? -1 : 1; }) };
      });
      source.textContent = 'Categories from lucide.dev';
      $('iconHint').textContent = browseList.length.toLocaleString() + ' icons in ' + CATS.length + ' categories';
      updateCurrentIcon();
      if (picker.open && !search.value.trim()) renderPicker();
      // Titles and heading icons from Lucide's repository (best effort, per category).
      return Promise.all(CATS.map(function (c) {
        return fetchJson(catDefUrls(c.slug)).then(function (def) {
          if (def && def.title) c.title = def.title;
          if (def && def.icon) { var e = byKey[norm(def.icon)]; if (e) c.icon = e.name; }
        }).catch(function () {});
      })).then(function () { if (picker.open && !search.value.trim()) renderPicker(); });
    }).catch(function () {
      CATS = null;
      source.textContent = 'Categories unavailable (lucide.dev not reachable) — showing all icons A to Z';
      if (picker.open && !search.value.trim()) renderPicker();
    });
  }

  function initIcons() {
    if (ICONS) return;                                   // already initialised
    if (!(window.lucide && window.lucide.icons)) {
      if (window.__lucideFailed) {
        $('iconName').textContent = 'Icon library did not load';
        $('iconHint').textContent = 'Check your internet connection and reload. Text-only thumbnails still work.';
        render();
      }
      return;                                            // still loading
    }
    ICONS = window.lucide.icons;
    iconList = Object.keys(ICONS).map(function (n) { return { name: n, label: kebab(n), key: norm(n) }; })
      .sort(function (a, b) { return a.label < b.label ? -1 : 1; });
    iconList.forEach(function (it) { byKey[it.key] = it; });
    browseList = iconList;
    if (!ICONS[state.icon]) state.icon = iconList[0].name;
    changeBtn.disabled = false;
    $('iconHint').textContent = iconList.length.toLocaleString() + ' icons available';
    updateCurrentIcon();
    render();
    loadTags();
    loadCategories();
  }
  window.__onLucide = initIcons;
  initIcons();

  // ---- Controls ---------------------------------------------------------------------
  $('title').addEventListener('input', function (e) { state.title = e.target.value; render(); });
  $('subtitle').addEventListener('input', function (e) { state.subtitle = e.target.value; render(); });

  document.querySelectorAll('.layouts button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.layout = b.getAttribute('data-layout');
      document.querySelectorAll('.layouts button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
  });

  $('bg').addEventListener('input', function (e) { setColors(e.target.value, state.fg); });
  $('fg').addEventListener('input', function (e) { setColors(state.bg, e.target.value); });
  $('swap').addEventListener('click', function () { setColors(state.fg, state.bg); });

  $('iconSize').addEventListener('input', function (e) { state.iconSize = +e.target.value / 100; render(); });
  $('stroke').addEventListener('input', function (e) { state.stroke = +e.target.value; render(); });

  $('size').addEventListener('change', function (e) {
    state.width = +e.target.value;
    render();
  });
  $('format').addEventListener('change', function (e) {
    state.format = e.target.value;
    $('download').textContent = 'Download ' + state.format.toUpperCase();
  });

  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  }

  $('download').addEventListener('click', function () {
    render();
    var isJpg = state.format === 'jpg';
    var name = (slug(state.title) || 'thumbnail') + '-' + canvas.width + 'x' + canvas.height + (isJpg ? '.jpg' : '.png');
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }, isJpg ? 'image/jpeg' : 'image/png', 0.92);
  });

  // ---- Fonts: redraw once Inter is available so the canvas matches the page ----------
  render();
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('600 40px Inter'), document.fonts.load('400 20px Inter')])
      .then(render, function () {});
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', render);
  }
})();
</script>
</body>
</html>
